# CI: untrusted (pull_request) jobs get read-only permissions and no secrets.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Lint + unit tests. Database integration tests (DBS_IT) need the full docker-compose stack
    # (TLS Postgres, MariaDB, DynamoDB Local, SSH bastion) and run in the e2e job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: System deps (Tauri / WebKitGTK)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Frontend dist placeholder (needed by tauri build script)
        run: mkdir -p frontend/dist && echo '<!doctype html>' > frontend/dist/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx eslint src --max-warnings 0
      - run: npx vitest run
      - run: npx vite build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    # Full stack exactly as developers run it locally (TLS Postgres, SSH bastion, MariaDB...).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test PKI
        run: docker compose build dev sshd && docker compose run --rm --no-deps dev tests/certs/gen.sh
      - name: Start services
        run: docker compose up -d --wait postgres mysql mariadb redis sshd dynamodb
      - name: Load demo fixtures
        run: tests/fixtures/load.sh
      - name: Build app + run all tests
        run: |
          docker compose run --rm dev sh -c '
            cd frontend && npm ci && npx vite build && cd .. &&
            cargo test --workspace &&
            cargo build -p dbstudio --features custom-protocol &&
            e2e/run.sh'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with: { name: e2e-artifacts, path: e2e/artifacts }

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - run: cargo install --locked cargo-audit cargo-deny
      - run: cargo audit
      - run: cargo deny check advisories licenses sources
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:latest git /repo --no-banner --redact
      - name: SAST
        run: docker run --rm -v "$PWD:/src:ro" semgrep/semgrep:latest semgrep scan --config p/rust --config p/typescript --config p/react --config p/secrets --config p/owasp-top-ten --metrics=off --error --exclude node_modules --exclude target
      - name: SBOM (CycloneDX via Syft)
        run: docker run --rm -v "$PWD:/src:ro" anchore/syft:latest dir:/src -o cyclonedx-json > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: sbom, path: sbom.cdx.json }

  macos-unsigned:
    # Unsigned universal build (no signing secrets in CI by design).
    needs: [rust, frontend]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npx vite build
        working-directory: frontend
      # No updater artifacts: they must be signed with TAURI_SIGNING_PRIVATE_KEY, which only the release workflow has.
      - run: ./frontend/node_modules/.bin/tauri build --target universal-apple-darwin --bundles app,dmg --config '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dbstudio-macos-universal-unsigned
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
