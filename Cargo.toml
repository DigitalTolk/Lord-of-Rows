[workspace]
resolver = "2"
members = [
  "crates/dbs-core",
  "crates/dbs-safety",
  "crates/dbs-audit",
  "crates/dbs-store",
  "crates/dbs-secrets",
  "crates/dbs-drivers",
  "crates/dbs-io",
  "crates/dbs-schema",
  "crates/dbs-ssh",
  "crates/dbs-ai",
  "crates/dbs-plugins",
  "src-tauri",
]
exclude = ["vendor/mysql_async"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
dbs-core = { path = "crates/dbs-core" }
dbs-safety = { path = "crates/dbs-safety" }
dbs-audit = { path = "crates/dbs-audit" }
dbs-store = { path = "crates/dbs-store" }
dbs-secrets = { path = "crates/dbs-secrets" }
dbs-drivers = { path = "crates/dbs-drivers" }
dbs-io = { path = "crates/dbs-io" }
dbs-schema = { path = "crates/dbs-schema" }
dbs-ssh = { path = "crates/dbs-ssh" }
dbs-ai = { path = "crates/dbs-ai" }
dbs-plugins = { path = "crates/dbs-plugins" }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.41", features = ["bundled", "backup", "column_decltype"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tokio-util = "0.7"
futures-util = "0.3"

# Plugins run in wasmtime's Pulley interpreter; unoptimised it is ~50x slower,
# which makes dev builds and tests crawl. Optimise just the wasm runtime crates.
[profile.dev.package.pulley-interpreter]
opt-level = 3
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3

# Patched for sha256_password auth support (see vendor/mysql_async/PATCH.md)
[patch.crates-io]
mysql_async = { path = "vendor/mysql_async" }
