# Local dev + integration-test environment.
# Credentials here are throwaway test-only values for disposable containers
# bound to 127.0.0.1. They are never used by the application itself.
services:
  dev:
    build:
      context: docker
      dockerfile: Dockerfile.dev
    image: dbstudio-dev:latest
    working_dir: /work
    volumes:
      - .:/work
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/target
      - node-modules:/work/frontend/node_modules
    environment:
      DBS_IT: "1"
      DBS_IT_PG_HOST: postgres
      DBS_IT_MYSQL_HOST: mysql
      DBS_IT_REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    command: sleep infinity

  # Preview the Linux build in a browser: http://localhost:6080/vnc.html?autoconnect=1&resize=scale
  desktop:
    build:
      context: docker
      dockerfile: Dockerfile.desktop
    image: dbstudio-desktop:latest
    volumes:
      - cargo-target:/target:ro
      - desktop-home:/home/app
    ports: ["127.0.0.1:6080:6080"]
    shm_size: "1gb"
    depends_on:
      postgres: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_started }

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dbs_test
      POSTGRES_PASSWORD: dbs_test
      POSTGRES_DB: dbs_test
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbs_test"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dbs_root_test
      MYSQL_USER: dbs_test
      MYSQL_PASSWORD: dbs_test
      MYSQL_DATABASE: dbs_test
    ports: ["127.0.0.1:53306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pdbs_root_test --silent"]
      interval: 3s
      retries: 40

  redis:
    image: redis:7
    ports: ["127.0.0.1:56379:6379"]

volumes:
  cargo-registry:
  cargo-target:
  node-modules:
  desktop-home:
