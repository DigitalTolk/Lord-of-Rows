# Local dev + integration-test environment.
# Credentials here are throwaway test-only values for disposable containers
# bound to 127.0.0.1. They are never used by the application itself.
services:
  dev:
    build:
      context: docker
      dockerfile: Dockerfile.dev
    image: dbstudio-dev:latest
    working_dir: /work
    volumes:
      - .:/work
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/target
      - node-modules:/work/frontend/node_modules
      - ./tests/certs:/certs:ro
      - ./tests/ssh:/ssh-keys:ro
    environment:
      DBS_IT: "1"
      DBS_IT_PG_HOST: postgres
      DBS_IT_MYSQL_HOST: mysql
      DBS_IT_REDIS_HOST: redis
      DBS_IT_SSH_HOST: sshd
    depends_on:
      postgres: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
      sshd: { condition: service_started }
    command: sleep infinity

  # Preview the Linux build in a browser: http://localhost:6080/vnc.html?autoconnect=1&resize=scale
  desktop:
    build:
      context: docker
      dockerfile: Dockerfile.desktop
    image: dbstudio-desktop:latest
    volumes:
      - cargo-target:/target:ro
      - desktop-home:/home/app
      - ./tests/certs:/certs:ro
    ports: ["127.0.0.1:6080:6080"]
    shm_size: "1gb"
    depends_on:
      postgres: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_started }

  # Test-only SSH bastion (user tunnel / tunnelpw; keys in tests/ssh).
  sshd:
    build:
      context: docker
      dockerfile: Dockerfile.sshd
    image: dbstudio-sshd:latest
    volumes:
      - ./tests/ssh:/keys
    ports: ["127.0.0.1:52222:22"]

  postgres:
    image: postgres:16
    # TLS enabled (optional, not required) with a test-only CA so TLS verification is testable.
    command: >
      bash -c "cp /certs/server.crt /certs/server.key /tmp/ && chown postgres /tmp/server.key && chmod 600 /tmp/server.key &&
      exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key"
    volumes:
      - ./tests/certs:/certs:ro
    environment:
      POSTGRES_USER: dbs_test
      POSTGRES_PASSWORD: dbs_test
      POSTGRES_DB: dbs_test
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbs_test"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dbs_root_test
      MYSQL_USER: dbs_test
      MYSQL_PASSWORD: dbs_test
      MYSQL_DATABASE: dbs_test
    ports: ["127.0.0.1:53306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pdbs_root_test --silent"]
      interval: 3s
      retries: 40

  redis:
    image: redis:7
    ports: ["127.0.0.1:56379:6379"]

volumes:
  cargo-registry:
  cargo-target:
  node-modules:
  desktop-home:
