[package]
name = "dbstudio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lord of the Rows - cross-platform database management"

[lib]
name = "dbstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
dbs-core.workspace = true
dbs-safety.workspace = true
dbs-audit.workspace = true
dbs-store.workspace = true
dbs-secrets.workspace = true
dbs-drivers.workspace = true
dbs-io.workspace = true
dbs-schema.workspace = true
dbs-ssh.workspace = true
dbs-ai.workspace = true
dbs-plugins.workspace = true
dbs-import.workspace = true
dbs-access.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
getrandom = "0.2"
flate2 = "1"
which = "7"
tempfile = "3"
tauri-plugin-updater = "2.14"
sha2.workspace = true
hex.workspace = true
semver = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
dbs-access = { workspace = true, features = ["test-util"] }
base64 = "0.23"
minisign-verify = "0.3"
