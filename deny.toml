# cargo-deny policy: licenses, advisories, banned/duplicate crates, sources.
[graph]
all-features = false

[advisories]
# Unmaintained/unsound advisories in Linux-only GTK/D-Bus transitive deps are tracked
# in SECURITY_FINDINGS.md (SF-004). Vulnerabilities are never ignored here.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time only, via gtk-rs on Linux" },
  { id = "RUSTSEC-2024-0429", reason = "glib VariantStrIter unsoundness: API not used; Linux-only via webkit2gtk" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained: Linux secret-service only" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained: Linux secret-service only" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained: Linux secret-service only" },
]

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "BSL-1.0", "0BSD", "CDLA-Permissive-2.0", "OpenSSL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
