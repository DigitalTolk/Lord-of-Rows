<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#231710"/>
      <stop offset="1" stop-color="#080504"/>
    </linearGradient>
    <radialGradient id="fire" cx="0.5" cy="0.6" r="0.55">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#e2561b" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#7c1d06" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldFront" gradientUnits="userSpaceOnUse" x1="0" y1="400" x2="0" y2="720">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.3" stop-color="#f7c54e"/>
      <stop offset="0.65" stop-color="#b47b18"/>
      <stop offset="1" stop-color="#5e3c08"/>
    </linearGradient>
    <linearGradient id="goldBack" gradientUnits="userSpaceOnUse" x1="0" y1="400" x2="0" y2="720">
      <stop offset="0" stop-color="#d6a23c"/>
      <stop offset="0.5" stop-color="#9c6a17"/>
      <stop offset="1" stop-color="#9c6a17"/>
    </linearGradient>
    <linearGradient id="row" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff4d6" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="sq"><rect width="1024" height="1024" rx="226"/></clipPath>
    <clipPath id="frontHalf"><rect x="0" y="560" width="1024" height="464"/></clipPath>
    <clipPath id="backHalf"><rect x="0" y="0" width="1024" height="560"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#fire)"/>

    <!-- back half of the ring (behind the rows) -->
    <g clip-path="url(#backHalf)">
      <ellipse cx="512" cy="560" rx="330" ry="150" fill="none" stroke="url(#goldBack)" stroke-width="78"/>
    </g>

    <!-- floating table rows, glowing -->
    <g filter="url(#soft)" opacity="0.9">
      <rect x="352" y="470" width="320" height="40" rx="12" fill="#ffb347"/>
      <rect x="322" y="536" width="380" height="40" rx="12" fill="#ffb347"/>
      <rect x="352" y="602" width="320" height="40" rx="12" fill="#ffb347"/>
    </g>
    <rect x="352" y="470" width="320" height="40" rx="12" fill="url(#row)"/>
    <rect x="322" y="536" width="380" height="40" rx="12" fill="url(#row)"/>
    <rect x="352" y="602" width="320" height="40" rx="12" fill="url(#row)"/>
    <g stroke="#3a2410" stroke-width="7" opacity="0.5">
      <line x1="460" y1="466" x2="460" y2="646"/><line x1="566" y1="466" x2="566" y2="646"/>
    </g>

    <!-- shadow under ring -->
    <ellipse cx="512" cy="640" rx="330" ry="110" fill="#000" opacity="0.35" filter="url(#soft)"/>

    <!-- front half of the ring (in front of the rows) -->
    <g clip-path="url(#frontHalf)">
      <ellipse cx="512" cy="560" rx="330" ry="150" fill="none" stroke="url(#goldFront)" stroke-width="78"/>
      
    </g>
    <!-- sides join both halves -->
    
    <!-- highlights -->
    <path d="M300 664 Q512 744 724 664" fill="none" stroke="#fffbe8" stroke-width="12" stroke-linecap="round" opacity="0.75"/>
    <path d="M236 540 Q262 470 360 438" fill="none" stroke="#ffe7a3" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>
